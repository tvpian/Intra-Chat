<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Knowledge Base</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #111827;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(0,200,210,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(20,70,130,0.22) 0%, transparent 50%);
      color: #f1f5f9;
      min-height: 100vh;
    }
    .header {
      background: rgba(26,34,53,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(34,245,255,0.2);
      padding: 15px 25px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header h1 { color: #22f5ff; font-size: 1.3em; font-weight: 700; text-shadow: 0 0 20px rgba(34,245,255,0.25); }
    .header h1 i { margin-right: 8px; }
    .header-links { display: flex; gap: 18px; align-items: center; }
    .back-link { color: #22f5ff; text-decoration: none; font-size: 0.9em; font-weight: 500; }
    .back-link:hover { text-decoration: underline; }

    .container { max-width: 1000px; margin: 0 auto; padding: 24px 25px 60px; }

    /* ── Project keyring bar ── */
    .keyring {
      background: rgba(26,34,53,0.75);
      border: 1px solid rgba(34,245,255,0.18);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 22px;
    }
    .keyring-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .keyring label { font-size: 0.82em; color: #94a3b8; margin-right: 4px; }
    select, input, textarea {
      padding: 9px 14px;
      background: rgba(20,28,45,0.9);
      border: 1px solid rgba(34,245,255,0.3);
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.9em;
      font-family: 'Inter', sans-serif;
    }
    select:focus, input:focus, textarea:focus { outline: none; border-color: rgba(34,245,255,0.6); }
    input::placeholder, textarea::placeholder { color: #94a3b8; }
    .btn {
      padding: 9px 18px;
      background: linear-gradient(135deg, #00c8d2 0%, #00a0a8 100%);
      color: #fff; border: none; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.9em; font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .btn:hover { background: linear-gradient(135deg, #00dce6 0%, #00b5be 100%); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,200,210,0.35); }
    .btn-outline { background: transparent; border: 1px solid rgba(34,245,255,0.4); color: #22f5ff; }
    .btn-outline:hover { background: rgba(34,245,255,0.1); box-shadow: none; }
    .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
    .btn-danger:hover { background: linear-gradient(135deg, #f05252 0%, #c81e1e 100%); box-shadow: 0 4px 16px rgba(239,68,68,0.3); }
    .btn-sm { padding: 5px 11px; font-size: 0.8em; }

    .add-key-panel { margin-top: 14px; display: none; gap: 10px; flex-wrap: wrap; align-items: center; }
    .add-key-panel.open { display: flex; }
    .hint { font-size: 0.8em; color: #94a3b8; margin-top: 8px; }
    .hint a { color: #22f5ff; }

    .status-line { font-size: 0.85em; margin-top: 10px; }
    .status-locked { color: #f59e0b; }
    .status-unlocked { color: #34d399; }

    /* ── New entry form ── */
    .new-entry {
      background: rgba(26,34,53,0.75);
      border: 1px solid rgba(34,245,255,0.18);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 22px;
    }
    .new-entry h3 { color: #22f5ff; font-size: 1em; margin-bottom: 12px; }
    .form-grid { display: flex; flex-direction: column; gap: 10px; }
    .form-grid input, .form-grid textarea, .form-grid select { width: 100%; }
    .form-grid textarea { min-height: 90px; resize: vertical; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .form-row > * { flex: 1; min-width: 140px; }
    .form-row .btn { flex: 0 0 auto; }

    /* ── Entry list ── */
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    .list-header h2 { font-size: 1.05em; color: #e2e8f0; }
    .count-badge { background: rgba(34,245,255,0.15); color: #22f5ff; padding: 2px 10px; border-radius: 20px; font-size: 0.8em; margin-left: 8px; }
    .search-box { min-width: 200px; }

    .entry {
      background: rgba(26,34,53,0.7);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .entry:hover { border-color: rgba(34,245,255,0.35); }
    .entry.pinned { border-color: rgba(245,158,11,0.5); }
    .entry-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .entry-title { font-size: 1.05em; font-weight: 600; color: #f8fafc; }
    .entry-meta { font-size: 0.78em; color: #94a3b8; margin-top: 3px; }
    .entry-body { margin-top: 10px; color: #cbd5e1; font-size: 0.92em; white-space: pre-wrap; line-height: 1.5; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .badge { font-size: 0.72em; padding: 2px 9px; border-radius: 20px; font-weight: 600; }
    .badge-private { background: rgba(245,158,11,0.18); color: #fbbf24; }
    .badge-team { background: rgba(52,211,153,0.18); color: #34d399; }
    .badge-agent { background: rgba(139,92,246,0.18); color: #c4b5fd; }
    .badge-human { background: rgba(34,245,255,0.15); color: #22f5ff; }
    .badge-tag { background: rgba(148,163,184,0.15); color: #cbd5e1; }
    .entry-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

    .empty { text-align: center; color: #64748b; padding: 50px 20px; }
    .empty i { font-size: 2.4em; margin-bottom: 12px; display: block; opacity: 0.5; }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a2235; border: 1px solid rgba(34,245,255,0.3);
      border-radius: 14px; padding: 22px; width: 100%; max-width: 560px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { color: #22f5ff; margin-bottom: 16px; }
    .modal .form-grid { margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .field-label { font-size: 0.8em; color: #94a3b8; margin-bottom: 4px; display: block; }

    /* ——— Responsive / mobile ——— */
    @media (max-width: 640px) {
      .header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px 16px; }
      .header-links { flex-wrap: wrap; gap: 10px 14px; width: 100%; }
      .container { padding: 18px 16px 50px; }
      .keyring-row { flex-direction: column; align-items: stretch; }
      .form-row { flex-direction: column; align-items: stretch; }
      .form-row > * { width: 100%; }
      .entry-top { flex-direction: column; align-items: stretch; }
      .modal { padding: 18px; }
      .modal-actions { flex-direction: column-reverse; }
      .modal-actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="fas fa-book-reader"></i> My Knowledge Base</h1>
    <div class="header-links">
      <a class="back-link" href="/braindump"><i class="fas fa-users"></i> Team Board</a>
      <a class="back-link" href="/admin/api-keys"><i class="fas fa-key"></i> API Keys</a>
      <a class="back-link" href="/"><i class="fas fa-arrow-left"></i> Chat</a>
    </div>
  </div>

  <div class="container">
    <!-- Project keyring -->
    <div class="keyring">
      <div class="keyring-row">
        <label for="projectSelect"><i class="fas fa-folder-open"></i> Project</label>
        <select id="projectSelect" onchange="selectProject(this.value)" style="min-width:200px;">
          <option value="">— no project unlocked —</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="toggleAddKey()"><i class="fas fa-plus"></i> Add project key</button>
        <button class="btn btn-danger btn-sm" id="forgetBtn" onclick="forgetProject()" style="display:none;"><i class="fas fa-unlink"></i> Forget</button>
      </div>
      <div class="add-key-panel" id="addKeyPanel">
        <input type="text" id="newKeyInput" placeholder="Paste project API key (ic_project_...)" style="flex:1; min-width:260px;">
        <button class="btn btn-sm" onclick="addProjectKey()"><i class="fas fa-unlock"></i> Unlock &amp; save</button>
      </div>
      <div class="status-line" id="statusLine">
        <span class="status-locked"><i class="fas fa-lock"></i> No project unlocked — add a project key to manage its private knowledge base.</span>
      </div>
      <div class="hint">Keys are stored locally in this browser only. Need one? Create it on the
        <a href="/admin/api-keys">API Keys</a> page.</div>
    </div>

    <!-- New entry -->
    <div class="new-entry" id="newEntryCard" style="display:none;">
      <h3><i class="fas fa-pen"></i> Add knowledge entry</h3>
      <div class="form-grid">
        <input type="text" id="entryTitle" placeholder="Title">
        <textarea id="entryContent" placeholder="Write your note (markdown supported)..."></textarea>
        <div class="form-row">
          <input type="text" id="entryTags" placeholder="Tags (comma separated)">
          <select id="entryVisibility">
            <option value="private">🔒 Private (only me)</option>
            <option value="team">👥 Team-visible</option>
          </select>
          <input type="text" id="entryAuthor" placeholder="Your name (optional)">
          <button class="btn" onclick="submitEntry()"><i class="fas fa-plus"></i> Add</button>
        </div>
      </div>
    </div>

    <!-- List -->
    <div class="list-header">
      <h2><i class="fas fa-list"></i> Entries <span class="count-badge" id="countBadge">0</span></h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" id="searchInput" class="search-box" placeholder="Search..." oninput="renderEntries()">
        <button class="btn btn-outline btn-sm" onclick="exportKb()"><i class="fas fa-download"></i> Export</button>
      </div>
    </div>
    <div id="entryList"></div>
  </div>

  <!-- Edit modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3><i class="fas fa-edit"></i> Edit entry</h3>
      <div class="form-grid">
        <div>
          <label class="field-label">Title</label>
          <input type="text" id="editTitle" style="width:100%;">
        </div>
        <div>
          <label class="field-label">Content</label>
          <textarea id="editContent" style="width:100%; min-height:130px; resize:vertical;"></textarea>
        </div>
        <div class="form-row">
          <div style="flex:1;">
            <label class="field-label">Tags (comma separated)</label>
            <input type="text" id="editTags" style="width:100%;">
          </div>
          <div style="flex:1;">
            <label class="field-label">Visibility</label>
            <select id="editVisibility" style="width:100%;">
              <option value="private">🔒 Private (only me)</option>
              <option value="team">👥 Team-visible</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
        <button class="btn" onclick="saveEdit()"><i class="fas fa-save"></i> Save</button>
      </div>
    </div>
  </div>

  <script>
    // ── Local project keyring (browser-only) ──────────────────────────
    const KEYRING_STORE = 'ic_kb_keyring';   // { project_id: api_key }
    const ACTIVE_STORE  = 'ic_kb_active';    // project_id
    let entries = [];
    let editingId = null;

    function loadKeyring() {
      try { return JSON.parse(localStorage.getItem(KEYRING_STORE) || '{}'); }
      catch (_) { return {}; }
    }
    function saveKeyring(k) { localStorage.setItem(KEYRING_STORE, JSON.stringify(k)); }
    function activeProject() { return localStorage.getItem(ACTIVE_STORE) || ''; }
    function activeKey() {
      const p = activeProject();
      return p ? (loadKeyring()[p] || '') : '';
    }
    function authHeaders(extra = {}) {
      const k = activeKey();
      return k ? { 'Authorization': 'Bearer ' + k, ...extra } : { ...extra };
    }

    // ── Project selection / keyring UI ────────────────────────────────
    function refreshProjectSelect() {
      const sel = document.getElementById('projectSelect');
      const keyring = loadKeyring();
      const active = activeProject();
      sel.innerHTML = '<option value="">— no project unlocked —</option>';
      Object.keys(keyring).sort().forEach(pid => {
        const opt = document.createElement('option');
        opt.value = pid; opt.textContent = pid;
        if (pid === active) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function updateStatus() {
      const status = document.getElementById('statusLine');
      const card = document.getElementById('newEntryCard');
      const forget = document.getElementById('forgetBtn');
      const p = activeProject();
      if (p && activeKey()) {
        status.innerHTML = '<span class="status-unlocked"><i class="fas fa-unlock"></i> Unlocked <strong>' +
          escapeHtml(p) + '</strong> — you can manage its knowledge base below.</span>';
        card.style.display = 'block';
        forget.style.display = 'inline-block';
      } else {
        status.innerHTML = '<span class="status-locked"><i class="fas fa-lock"></i> No project unlocked — add a project key to manage its private knowledge base.</span>';
        card.style.display = 'none';
        forget.style.display = 'none';
      }
    }

    function toggleAddKey() {
      document.getElementById('addKeyPanel').classList.toggle('open');
      document.getElementById('newKeyInput').focus();
    }

    async function addProjectKey() {
      const raw = document.getElementById('newKeyInput').value.trim();
      if (!raw) { alert('Paste an API key first.'); return; }
      // Derive project id from key format ic_<project>_<hex>
      const m = raw.match(/^ic_(.+)_[0-9a-f]{8,}$/i);
      if (!m) { alert('That does not look like a valid key (expected ic_<project>_<hex>).'); return; }
      const projectId = m[1];
      // Validate against the server before saving.
      let ok = false;
      try {
        const res = await fetch('/api/braindump?mine=1', { headers: { 'Authorization': 'Bearer ' + raw } });
        ok = res.ok;
      } catch (_) { ok = false; }
      if (!ok) { alert('Key rejected by the server. Check that it is correct and not revoked.'); return; }
      const keyring = loadKeyring();
      keyring[projectId] = raw;
      saveKeyring(keyring);
      localStorage.setItem(ACTIVE_STORE, projectId);
      document.getElementById('newKeyInput').value = '';
      document.getElementById('addKeyPanel').classList.remove('open');
      refreshProjectSelect();
      updateStatus();
      fetchEntries();
    }

    function selectProject(pid) {
      localStorage.setItem(ACTIVE_STORE, pid);
      updateStatus();
      fetchEntries();
    }

    function forgetProject() {
      const p = activeProject();
      if (!p) return;
      if (!confirm('Remove the saved key for "' + p + '" from this browser? (The key itself is not revoked.)')) return;
      const keyring = loadKeyring();
      delete keyring[p];
      saveKeyring(keyring);
      localStorage.removeItem(ACTIVE_STORE);
      entries = [];
      refreshProjectSelect();
      updateStatus();
      renderEntries();
    }

    // ── Entries ───────────────────────────────────────────────────────
    async function fetchEntries() {
      if (!activeKey()) { entries = []; renderEntries(); return; }
      try {
        const res = await fetch('/api/braindump?mine=1', { headers: authHeaders() });
        if (!res.ok) { entries = []; renderEntries(); return; }
        entries = await res.json();
      } catch (_) { entries = []; }
      renderEntries();
    }

    function renderEntries() {
      const list = document.getElementById('entryList');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      let items = entries.slice();
      if (q) {
        items = items.filter(e =>
          (e.title || '').toLowerCase().includes(q) ||
          (e.content || '').toLowerCase().includes(q) ||
          (e.tags || []).some(t => t.toLowerCase().includes(q)));
      }
      items.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      document.getElementById('countBadge').textContent = items.length;

      if (!activeKey()) {
        list.innerHTML = '<div class="empty"><i class="fas fa-lock"></i>Unlock a project above to view and manage its knowledge base.</div>';
        return;
      }
      if (items.length === 0) {
        list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>No entries yet. Add your first note above.</div>';
        return;
      }
      list.innerHTML = items.map(e => {
        const vis = e.visibility || 'private';
        const visBadge = vis === 'team'
          ? '<span class="badge badge-team"><i class="fas fa-users"></i> Team</span>'
          : '<span class="badge badge-private"><i class="fas fa-lock"></i> Private</span>';
        const srcBadge = e.source === 'agent'
          ? '<span class="badge badge-agent"><i class="fas fa-robot"></i> Agent</span>'
          : '<span class="badge badge-human"><i class="fas fa-user"></i> Human</span>';
        const tagBadges = (e.tags || []).map(t => '<span class="badge badge-tag">#' + escapeHtml(t) + '</span>').join('');
        const created = (e.created_at || '').slice(0, 16).replace('T', ' ');
        const toggleLabel = vis === 'team'
          ? '<i class="fas fa-eye-slash"></i> Make private'
          : '<i class="fas fa-users"></i> Share with team';
        const toggleTo = vis === 'team' ? 'private' : 'team';
        return `
          <div class="entry ${e.pinned ? 'pinned' : ''}">
            <div class="entry-top">
              <div>
                <div class="entry-title">${e.pinned ? '📌 ' : ''}${escapeHtml(e.title || 'Untitled')}</div>
                <div class="entry-meta">by ${escapeHtml(e.author || 'Anonymous')} · ${created}</div>
              </div>
            </div>
            <div class="entry-body">${escapeHtml(e.content || '')}</div>
            <div class="badges">${visBadge}${srcBadge}${tagBadges}</div>
            <div class="entry-actions">
              <button class="btn btn-outline btn-sm" onclick="togglePin('${e.id}', ${!e.pinned})">
                <i class="fas fa-thumbtack"></i> ${e.pinned ? 'Unpin' : 'Pin'}</button>
              <button class="btn btn-outline btn-sm" onclick="toggleVisibility('${e.id}', '${toggleTo}')">${toggleLabel}</button>
              <button class="btn btn-outline btn-sm" onclick="openEditModal('${e.id}')"><i class="fas fa-edit"></i> Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteEntry('${e.id}')"><i class="fas fa-trash"></i> Delete</button>
            </div>
          </div>`;
      }).join('');
    }

    async function submitEntry() {
      const p = activeProject();
      if (!p || !activeKey()) { alert('Unlock a project first.'); return; }
      const content = document.getElementById('entryContent').value.trim();
      if (!content) { alert('Content is required.'); return; }
      const body = {
        title: document.getElementById('entryTitle').value.trim(),
        content,
        tags: document.getElementById('entryTags').value,
        visibility: document.getElementById('entryVisibility').value,
        author: document.getElementById('entryAuthor').value.trim() || undefined,
        project_id: p,
      };
      const res = await fetch('/api/braindump', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(body),
      });
      if (!res.ok) { alert('Failed to add: ' + (await safeErr(res))); return; }
      document.getElementById('entryTitle').value = '';
      document.getElementById('entryContent').value = '';
      document.getElementById('entryTags').value = '';
      fetchEntries();
    }

    async function togglePin(id, pinned) {
      const res = await fetch('/api/braindump/' + id, {
        method: 'PUT',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ pinned }),
      });
      if (!res.ok) { alert('Failed: ' + (await safeErr(res))); return; }
      fetchEntries();
    }

    async function toggleVisibility(id, newVis) {
      const res = await fetch('/api/braindump/' + id, {
        method: 'PUT',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ visibility: newVis }),
      });
      if (!res.ok) { alert('Failed: ' + (await safeErr(res))); return; }
      fetchEntries();
    }

    async function deleteEntry(id) {
      if (!confirm('Delete this entry permanently?')) return;
      const res = await fetch('/api/braindump/' + id, { method: 'DELETE', headers: authHeaders() });
      if (!res.ok) { alert('Failed: ' + (await safeErr(res))); return; }
      fetchEntries();
    }

    function openEditModal(id) {
      const e = entries.find(x => x.id === id);
      if (!e) return;
      editingId = id;
      document.getElementById('editTitle').value = e.title || '';
      document.getElementById('editContent').value = e.content || '';
      document.getElementById('editTags').value = (e.tags || []).join(', ');
      document.getElementById('editVisibility').value = e.visibility || 'private';
      document.getElementById('editModal').classList.add('open');
    }
    function closeEditModal() {
      editingId = null;
      document.getElementById('editModal').classList.remove('open');
    }
    async function saveEdit() {
      if (!editingId) return;
      const body = {
        title: document.getElementById('editTitle').value.trim(),
        content: document.getElementById('editContent').value.trim(),
        tags: document.getElementById('editTags').value,
        visibility: document.getElementById('editVisibility').value,
      };
      const res = await fetch('/api/braindump/' + editingId, {
        method: 'PUT',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(body),
      });
      if (!res.ok) { alert('Failed: ' + (await safeErr(res))); return; }
      closeEditModal();
      fetchEntries();
    }

    async function exportKb() {
      if (!activeKey()) { alert('Unlock a project first.'); return; }
      const res = await fetch('/api/braindump/export', { headers: authHeaders() });
      const text = await res.text();
      const blob = new Blob([text], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = (activeProject() || 'knowledge') + '_kb.md';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ── Helpers ───────────────────────────────────────────────────────
    async function safeErr(res) {
      try { const j = await res.json(); return j.error || res.status; }
      catch (_) { return res.status; }
    }
    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    // ── Init ──────────────────────────────────────────────────────────
    refreshProjectSelect();
    updateStatus();
    fetchEntries();
  </script>
</body>
