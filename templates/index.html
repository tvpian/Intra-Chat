<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBWH Intra-Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    /* Existing CSS styles */
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      position: relative;
    }
    h1 {
      color: #00adb5;
    }
    /* Changed input style to textarea style for multi-line support */
    textarea#message {
      padding: 12px;
      width: 500px;
      height: 80px;
      border: 2px solid #00adb5;
      border-radius: 5px;
      background-color: #16213e;
      color: white;
      margin: 10px 0;
      resize: vertical;
      font-family: Arial, sans-serif;
    }
    button {
      padding: 12px 20px;
      background-color: #00adb5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover {
      background-color: #007a85;
    }
    ul {
      list-style-type: none;
      padding: 0;
      width: 1000px;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #00adb5;
      border-radius: 5px;
      background-color: #0f3460;
      box-shadow: 0 4px 8px rgba(0, 173, 181, 0.3);
    }
    li {
      padding: 10px;
      border-bottom: 1px solid #1a1a2e;
      white-space: pre-wrap;  /* Preserve newlines */
    }
    li:last-child {
      border-bottom: none;
    }
    /* Updated Shortcuts Panel - Top Right, shifted left */
    #shortcuts {
      position: fixed;
      top: 10px;
      right: 200px;  /* Increased value moves it leftwards */
      background-color: rgba(0, 173, 181, 0.1);
      padding: 5px 8px;
      border-radius: 5px;
      width: 50px;
      font-size: 0.75em;
      color: #e0e0e0;
      z-index: 1000;
    }
    #shortcuts h2 {
      margin: 0 0 5px 0;
      color: #00adb5;
      font-size: 0.9em;
    }
    #shortcuts ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #shortcuts li {
      margin: 2px 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var socket = io();
      // Retrieve username from localStorage.
      var storedUsername = localStorage.getItem("chatUsername");
      var username = storedUsername || prompt("Enter your name:");
      if (!storedUsername) {
        localStorage.setItem("chatUsername", username);
      }
      
      var messages = document.getElementById("messages");
      var input = document.getElementById("message");

      // Focus the textarea on page load.
      input.focus();

      function sendMessage() {
        var msg = input.value;
        if (msg) {
          socket.send(username + ": " + msg);
          input.value = "";
        }
      }

      document.getElementById("sendBtn").addEventListener("click", function() {
        sendMessage();
      });

      // Allow Enter to send, Shift+Enter to add newline.
      input.addEventListener("keypress", function(event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      socket.on("message", function(data) {
        try {
          var parsed = JSON.parse(data);
          if (Array.isArray(parsed)) {
            messages.innerHTML = "";
            var startIndex = parsed.length > 5 ? parsed.length - 5 : 0;
            for (var i = startIndex; i < parsed.length; i++) {
              var li = document.createElement("li");
              li.textContent = parsed[i].msg;
              messages.appendChild(li);
            }
          } else if (parsed && typeof parsed === "object" && "msg" in parsed) {
            var li = document.createElement("li");
            li.textContent = parsed.msg;
            messages.appendChild(li);
            while (messages.children.length > 5) {
              messages.removeChild(messages.firstChild);
            }
          }
        } catch (e) {
          var li = document.createElement("li");
          li.textContent = data;
          messages.appendChild(li);
          while (messages.children.length > 5) {
            messages.removeChild(messages.firstChild);
          }
        }
        messages.scrollTop = messages.scrollHeight;
      });

      // Keyboard shortcuts:
      document.addEventListener("keydown", function(event) {
        // Ctrl + E: Export the last message to the Tech Manual.
        if (event.ctrlKey && event.key.toLowerCase() === "e") {
          var lastMsgElem = messages.lastElementChild;
          if (lastMsgElem) {
            var exportMsg = lastMsgElem.textContent;
            var category = prompt("Enter category/label for this Tech Manual entry:");
            if (category) {
              var payload = {
                message: exportMsg,
                category: category,
                username: username,
                timestamp: new Date().toISOString()
              };
              fetch('/export', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              })
              .then(function(response) { return response.json(); })
              .then(function(data) { console.log("Export response:", data); })
              .catch(function(err) { console.error("Export error:", err); });
            }
          } else {
            console.log("No last message to export.");
          }
          event.preventDefault();
        }
        // Ctrl + H: Navigate to History page.
        if (event.ctrlKey && event.key.toLowerCase() === "h") {
          window.location.href = "/history";
          event.preventDefault();
        }
        // Ctrl + U: Change Username.
        if (event.ctrlKey && event.key.toLowerCase() === "u") {
          localStorage.removeItem("chatUsername");
          location.reload();
          event.preventDefault();
        }
        // Arrow Up: Scroll up the messages list.
        if (event.key === "ArrowUp") {
          messages.scrollBy({ top: -30, behavior: "smooth" });
          event.preventDefault();
        }
        // Arrow Down: Scroll down the messages list.
        if (event.key === "ArrowDown") {
          messages.scrollBy({ top: 30, behavior: "smooth" });
          event.preventDefault();
        }
        // Ctrl + C: Always copy the last message to the clipboard.
        // Inside the Ctrl+C block:
        // Ctrl + C: Always copy the last message to the clipboard.
        if (event.ctrlKey && event.key.toLowerCase() === "c") {
          var lastMsgElem = messages.lastElementChild;
          if (lastMsgElem) {
            var lastMsg = lastMsgElem.textContent; // Now defined before use.
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(lastMsg)
                .then(function() { console.log("Copied last message to clipboard:", lastMsg); })
                .catch(function(err) { console.error("Failed to copy:", err); });
            } else {
              // Fallback: use execCommand.
              var tempInput = document.createElement("textarea");
              tempInput.value = lastMsg;
              document.body.appendChild(tempInput);
              tempInput.select();
              try {
                document.execCommand("copy");
                console.log("Copied last message using fallback:", lastMsg);
              } catch (err) {
                console.error("Fallback copy failed:", err);
              }
              document.body.removeChild(tempInput);
            }
          } else {
            console.log("No last message to copy.");
          }
          event.preventDefault();
        }
      });
    });
  </script>
</head>
<body>
  <h1>MBWH Intra-Chat</h1>
  <!-- Changed input to textarea for multi-line support -->
  <textarea id="message" placeholder="Type a message & hit Enter" rows="3"></textarea>
  <button id="sendBtn">Send</button>
  <button onclick="window.location.href='/history'">History</button>
  <ul id="messages"></ul>
  
  <!-- Shortcuts Panel at Top Right (shifted left a bit) -->
  <div id="shortcuts">
    <h2>Shortcuts</h2>
    <ul>
      <li><strong>Enter</strong> - Send text</li>
      <li><strong>Ctrl + h</strong> - Go to history</li>
      <li><strong>Ctrl + u</strong> - Change Username</li>
      <li><strong>Up</strong> - Scroll up</li>
      <li><strong>Down</strong> - Scroll down</li>
      <li><strong>Ctrl + c</strong> - Copy last msg</li>
      <li><strong>Ctrl + e</strong> - Export last msg</li>
    </ul>
  </div>
</body>
</html>
