<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat History</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #111827;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(0,200,210,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(20,70,130,0.22) 0%, transparent 50%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      position: relative;
    }
    h1 {
      color: #22f5ff;
      font-size: 1.6em;
      font-weight: 700;
      margin-bottom: 12px;
      text-shadow: 0 0 24px rgba(34,245,255,0.35);
    }
    ul {
      list-style-type: none;
      padding: 0;
      width: 900px;
      max-width: 90vw;
      max-height: 70vh;
      overflow-y: auto;
      border: 1px solid rgba(34,245,255,0.3);
      border-radius: 12px;
      background: rgba(20,28,45,0.9);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    ul::-webkit-scrollbar { width: 5px; }
    ul::-webkit-scrollbar-track { background: transparent; }
    ul::-webkit-scrollbar-thumb { background: rgba(0,200,210,0.35); border-radius: 3px; }
    ul::-webkit-scrollbar-thumb:hover { background: rgba(0,200,210,0.55); }
    li {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      white-space: pre-wrap;
      font-size: 0.9em;
      line-height: 1.55;
      position: relative;
      transition: background 0.15s;
    }
    li:hover { background: rgba(0,200,210,0.12); }
    li:hover .copy-btn { opacity: 1; }
    li:last-child { border-bottom: none; }
    .timestamp {
      color: #22f5ff;
      font-size: 0.8em;
      float: right;
      opacity: 0.8;
    }
    .copy-btn {
      display: block;
      width: 60px;
      margin: 8px auto 0 auto;
      background: rgba(0,200,210,0.8);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.7em;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background-color 0.2s ease;
      text-align: center;
    }
    .copy-btn:hover { background: #00c8d2; }
    button {
      padding: 10px 18px;
      background: linear-gradient(135deg, #00c8d2 0%, #00a0a8 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 12px 4px;
      font-weight: 600;
      font-size: 0.85em;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
    }
    button:hover {
      background: linear-gradient(135deg, #00dce6 0%, #00b5be 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,200,210,0.35);
    }
    #shortcuts {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(26,34,53,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(34,245,255,0.3);
      padding: 12px 16px;
      border-radius: 12px;
      width: 180px;
      font-size: 0.7em;
      color: #a0b4c8;
      z-index: 1000;
    }
    #shortcuts h2 {
      margin: 0 0 8px 0;
      color: #22f5ff;
      font-size: 0.9em;
      font-weight: 600;
      text-transform: uppercase;
    }
    #shortcuts ul {
      list-style: none; margin: 0; padding: 0;
      border: none; background: none; backdrop-filter: none;
      box-shadow: none; width: auto; max-height: none; overflow-y: visible;
    }
    #shortcuts li { margin: 3px 0; line-height: 1.4; padding: 0; border: none; }
    #shortcuts li:hover { background: none; }
    #shortcuts li strong { color: #c0d0e0; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.95em; }
    @media only screen and (max-width: 600px) {
      body { justify-content: flex-start; padding: 10px; }
      ul { width: 95% !important; max-height: 60vh; }
      #shortcuts { display: none; }
      button { padding: 10px 14px; font-size: 0.9em; }
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Automatically scroll the history list to the bottom.
      var historyList = document.getElementById("historyList");
      if(historyList) {
        historyList.scrollTop = historyList.scrollHeight;
      }

      // Parse file messages (stored as JSON) and render them properly
      document.querySelectorAll('.message-content').forEach(span => {
        const text = span.textContent.trim();
        try {
          const data = JSON.parse(text);
          if (data && data.isFile) {
            span.innerHTML = '';
            const ext = data.msg.split('.').pop().toLowerCase();
            if (['png','jpg','jpeg','gif'].includes(ext)) {
              const img = document.createElement('img');
              img.src = data.msg;
              img.style.maxWidth = '300px';
              img.style.display = 'block';
              img.style.borderRadius = '8px';
              span.appendChild(img);
              const cap = document.createElement('div');
              cap.textContent = data.name;
              cap.style.color = '#94a3b8';
              cap.style.fontSize = '0.8em';
              cap.style.marginTop = '4px';
              span.appendChild(cap);
            } else {
              const a = document.createElement('a');
              a.href = data.msg;
              a.textContent = '\u{1F4CE} ' + data.name;
              a.download = data.name;
              a.style.color = '#22f5ff';
              span.appendChild(a);
            }
          }
        } catch(e) {
          // Not JSON — regular text message, leave as-is
        }
      });

      // Listen for Backspace, ArrowUp, and ArrowDown keys.
      document.addEventListener("keydown", function(event) {
        // Backspace goes back to the chat page.
        if (event.key === "Backspace") {
          window.location.href = "/";
          event.preventDefault();
        }
        // ArrowUp scrolls up the history list.
        else if (event.key === "ArrowUp") {
          if (historyList) {
            historyList.scrollBy({ top: -50, behavior: "smooth" });
            event.preventDefault();
          }
        }
        // ArrowDown scrolls down the history list.
        else if (event.key === "ArrowDown") {
          if (historyList) {
            historyList.scrollBy({ top: 50, behavior: "smooth" });
            event.preventDefault();
          }
        }
      });
    });

    // Copy to clipboard function
    function copyToClipboard(button) {
      const li = button.parentElement;
      const messageContent = li.querySelector('.message-content').textContent;
      
      // Remove username from the message (everything before the first colon)
      let textToCopy = messageContent;
      if (messageContent.includes(':')) {
        const colonIndex = messageContent.indexOf(':');
        textToCopy = messageContent.substring(colonIndex + 1).trim();
      }
      
      // Try modern clipboard API first
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          showCopyFeedback(button);
        }).catch(() => {
          fallbackCopy(textToCopy, button);
        });
      } else {
        fallbackCopy(textToCopy, button);
      }
    }

    // Fallback copy method for older browsers
    function fallbackCopy(text, button) {
      const tmp = document.createElement("textarea");
      tmp.style.position = "fixed";
      tmp.style.opacity = "0";
      tmp.value = text;
      document.body.appendChild(tmp);
      tmp.select();
      try {
        document.execCommand("copy");
        showCopyFeedback(button);
      } catch (err) {
        console.error("Copy failed:", err);
      }
      document.body.removeChild(tmp);
    }

    // Show copy feedback
    function showCopyFeedback(button) {
      const originalText = button.textContent;
      button.textContent = "✓";
      button.style.backgroundColor = "#28a745";
      setTimeout(() => {
        button.textContent = originalText;
        button.style.backgroundColor = "#00c8d2";
      }, 1000);
    }
  </script>
</head>
<body>
  <h1>Chat History</h1>
  <ul id="historyList">
    {% for entry in chat_history %}
      <li>
        <span class="timestamp">{{ entry.timestamp[:19].replace("T", " ") }}</span>
        <span class="message-content">{{ entry.msg }}</span>
        <button class="copy-btn" onclick="copyToClipboard(this)" title="Copy message">📋</button>
      </li>
    {% endfor %}
  </ul>
  <button onclick="window.location.href='/'">Back to Chat</button>
  <!-- Shortcuts Panel at Top Right (shifted left a bit) -->
    <div id="shortcuts">
        <h2>Shortcuts</h2>
        <ul>
          <!-- <li><strong>Enter</strong> - Send text</li> -->
          <!-- <li><strong>Ctrl + h</strong> - Go to history</li> -->
          <!-- <li><strong>Ctrl + u</strong> - Change Username</li> -->
          <li><strong>Backspace</strong> - Go back to chat</li>
          <li><strong>Up</strong> - Scroll up</li>
          <li><strong>Down</strong> - Scroll down</li>
        </ul>
      </div>
</body>
</html>
