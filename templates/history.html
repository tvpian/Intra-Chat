<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat History</title>
  <style>
      /* ——— MOBILE RESPONSIVE OVERRIDES ——— */
      @media only screen and (max-width: 600px) {
      body {
        justify-content: flex-start;
        padding: 10px;
      }
      textarea#message {
        width: 90%!important;
      }
      ul {
        width: 90%!important;
        max-height: 60vh;
      }
      #quickActions,
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
      }
      button,
      .action-btn {
        padding: 10px 14px;
        font-size: 0.9em;
      }
      #shortcuts {
        display: none; /* hide on mobile for space */
      }
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      position: relative;
    }
    h1 { 
      color: #00adb5; 
    }
    ul {
      list-style-type: none;
      padding: 0;
      width: 1000px;
      max-height: 70vh;
      overflow-y: auto;
      border: 1px solid #00adb5;
      border-radius: 5px;
      background-color: #0f3460;
      box-shadow: 0 4px 8px rgba(0, 173, 181, 0.3);
    }
    li {
      padding: 10px;
      border-bottom: 1px solid #1a1a2e;
      white-space: pre-wrap;
    }
    li:hover {
      background-color: rgba(0, 173, 181, 0.1);
    }
    li:hover .copy-btn {
      opacity: 1;
    }
    li:last-child {
      border-bottom: none;
    }
    .timestamp {
      color: #00adb5;
      font-size: 0.8em;
      float: right;
      opacity: 0.8;
    }
    .copy-btn {
      display: block;
      width: 60px;
      margin: 8px auto 0 auto;
      background-color: #00adb5;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 4px 8px;
      font-size: 0.7em;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background-color 0.2s ease;
      text-align: center;
    }
    .copy-btn:hover {
      background-color: #007a85;
    }
    .copy-btn:active {
      background-color: #005a61;
    }
    li:last-child {
      border-bottom: none;
    }
    button {
      padding: 12px 20px;
      background-color: #00adb5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover { 
      background-color: #007a85; 
    }
    #shortcuts {
      position: fixed;
      top: 10px;
      right: 200px;
      background-color: rgba(0, 173, 181, 0.1);
      padding: 5px 8px;
      border-radius: 5px;
      width: 50px;
      font-size: 0.75em;
      color: #e0e0e0;
      z-index: 1000;
    }
    #shortcuts h2 {
      margin: 0 0 5px 0;
      color: #00adb5;
      font-size: 0.9em;
    }
    #shortcuts ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #shortcuts li {
      margin: 2px 0;
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Automatically scroll the history list to the bottom.
      var historyList = document.getElementById("historyList");
      if(historyList) {
        historyList.scrollTop = historyList.scrollHeight;
      }

      // Listen for Backspace, ArrowUp, and ArrowDown keys.
      document.addEventListener("keydown", function(event) {
        // Backspace goes back to the chat page.
        if (event.key === "Backspace") {
          window.location.href = "/";
          event.preventDefault();
        }
        // ArrowUp scrolls up the history list.
        else if (event.key === "ArrowUp") {
          if (historyList) {
            historyList.scrollBy({ top: -50, behavior: "smooth" });
            event.preventDefault();
          }
        }
        // ArrowDown scrolls down the history list.
        else if (event.key === "ArrowDown") {
          if (historyList) {
            historyList.scrollBy({ top: 50, behavior: "smooth" });
            event.preventDefault();
          }
        }
      });
    });

    // Copy to clipboard function
    function copyToClipboard(button) {
      const li = button.parentElement;
      const messageContent = li.querySelector('.message-content').textContent;
      
      // Remove username from the message (everything before the first colon)
      let textToCopy = messageContent;
      if (messageContent.includes(':')) {
        const colonIndex = messageContent.indexOf(':');
        textToCopy = messageContent.substring(colonIndex + 1).trim();
      }
      
      // Try modern clipboard API first
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          showCopyFeedback(button);
        }).catch(() => {
          fallbackCopy(textToCopy, button);
        });
      } else {
        fallbackCopy(textToCopy, button);
      }
    }

    // Fallback copy method for older browsers
    function fallbackCopy(text, button) {
      const tmp = document.createElement("textarea");
      tmp.style.position = "fixed";
      tmp.style.opacity = "0";
      tmp.value = text;
      document.body.appendChild(tmp);
      tmp.select();
      try {
        document.execCommand("copy");
        showCopyFeedback(button);
      } catch (err) {
        console.error("Copy failed:", err);
      }
      document.body.removeChild(tmp);
    }

    // Show copy feedback
    function showCopyFeedback(button) {
      const originalText = button.textContent;
      button.textContent = "✓";
      button.style.backgroundColor = "#28a745";
      setTimeout(() => {
        button.textContent = originalText;
        button.style.backgroundColor = "#00adb5";
      }, 1000);
    }
  </script>
</head>
<body>
  <h1>Chat History</h1>
  <ul id="historyList">
    {% for entry in chat_history %}
      <li>
        <span class="timestamp">{{ entry.timestamp[:19].replace("T", " ") }}</span>
        <span class="message-content">{{ entry.msg }}</span>
        <button class="copy-btn" onclick="copyToClipboard(this)" title="Copy message">📋</button>
      </li>
    {% endfor %}
  </ul>
  <button onclick="window.location.href='/'">Back to Chat</button>
  <!-- Shortcuts Panel at Top Right (shifted left a bit) -->
    <div id="shortcuts">
        <h2>Shortcuts</h2>
        <ul>
          <!-- <li><strong>Enter</strong> - Send text</li> -->
          <!-- <li><strong>Ctrl + h</strong> - Go to history</li> -->
          <!-- <li><strong>Ctrl + u</strong> - Change Username</li> -->
          <li><strong>Backspace</strong> - Go back to chat</li>
          <li><strong>Up</strong> - Scroll up</li>
          <li><strong>Down</strong> - Scroll down</li>
        </ul>
      </div>
</body>
</html>
